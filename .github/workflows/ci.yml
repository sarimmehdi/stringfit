name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (ktlint, detekt, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `build` runs ktlintCheck and detekt as part of `check`.
      - name: Build and verify
        run: ./gradlew build --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-reports
          path: |
            plugin/build/reports/
            plugin/build/test-results/
          if-no-files-found: ignore

  sample:
    name: End-to-end on the sample app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The whole point of the plugin: applied once at the root, it configures
      # every Android module. If this job passes, that contract holds.
      - name: Install the harness
        working-directory: sample
        run: ./gradlew stringFitInstallHarness --overwrite --stacktrace

      - name: Measure every preview
        working-directory: sample
        run: ./gradlew test --stacktrace

      - name: Report
        working-directory: sample
        run: ./gradlew stringFitReport --stacktrace

      # The sample deliberately contains a cut-off string, a budget conflict, an
      # unused string and a layout that does not mirror. If any of them stops
      # being detected, the measurement pipeline has regressed.
      - name: Assert the known findings are still detected
        working-directory: sample
        run: |
          report=build/reports/stringfit/report.txt
          test -f "$report" || { echo "no report produced"; exit 1; }
          cat "$report"
          for expected in \
            "core_status_downloading" \
            "action_download_all" \
            "RTL ASYMMETRY" \
            "legacy_unused_hint" \
            "CONFLICT"; do
            grep -q "$expected" "$report" \
              || { echo "::error::report no longer mentions '$expected'"; exit 1; }
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: sample/build/reports/stringfit/
          if-no-files-found: ignore
