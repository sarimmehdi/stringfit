name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to the Gradle Plugin Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Never publish something that does not pass its own checks.
      - name: Verify
        run: ./gradlew build --stacktrace

      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(./gradlew -q :plugin:properties | awk -F': ' '/^version:/ {print $2}')
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=$declared tag=$tagged"
          test "$declared" = "$tagged" \
            || { echo "::error::tag $tagged does not match project version $declared"; exit 1; }

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins --stacktrace

      - name: Validate only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins --validate-only --stacktrace
